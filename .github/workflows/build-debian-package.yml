name: Build Debian Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0beta1)'
        required: true
        default: 'test'

env:
  APP_NAME: alsa-scarlett-gui
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc libgtk-4-dev libasound2-dev libssl-dev

      - name: Build deb
        run: make deb VERSION=${{ env.APP_VERSION }}

      - name: Find deb
        id: find-deb
        run: echo "deb_path=$(ls ${{ env.APP_NAME }}_*.deb | head -1)" >> $GITHUB_OUTPUT

      - name: Upload deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ${{ steps.find-deb.outputs.deb_path }}
